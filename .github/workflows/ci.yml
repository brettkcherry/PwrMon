name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags. A tag is mutable: whoever
# controls an action's repository can repoint `v7` at new code whenever they
# like, and every workflow using it picks that up silently on the next run.
# This job holds no secrets today, so a compromised action could only tamper
# with build output — but that stops being the ceiling the moment a release
# workflow with a signing key lands beside it. The trailing comment records
# which tag each SHA came from; Dependabot reads that format and keeps the two
# in sync.
jobs:
  build-and-test:
    # WPF + WMI + performance counters: this only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PwrMon.sln

      - name: Build
        run: dotnet build PwrMon.sln -c Release --no-restore

      - name: Test
        run: dotnet test PwrMon.sln -c Release --no-build --verbosity normal

      - name: Check third-party notices are current
        shell: pwsh
        run: |
          # Fails the job if a dependency change added something that isn't plain MIT
          # without THIRD-PARTY-NOTICES.md being updated to match.
          $output = ./tools/list-shipped-assemblies.ps1 6>&1 | Out-String
          Write-Host $output
          $notices = Get-Content THIRD-PARTY-NOTICES.md -Raw
          $missing = @()
          foreach ($line in $output -split "`n") {
            if ($line -match '^\s{2}(\S+)\s+\S+\s+—\s+(.+)$') {
              $pkg = $Matches[1]
              if ($notices -notmatch [regex]::Escape($pkg)) { $missing += $pkg }
            }
          }
          if ($missing) {
            Write-Host "::error::Not documented in THIRD-PARTY-NOTICES.md: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All non-MIT components are documented."
